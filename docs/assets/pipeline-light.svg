<text x="510.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">03  RECOGNIZE</text>
<text x="510.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">every line cropped at once</text>
<text x="510.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">batched across pages</text>
