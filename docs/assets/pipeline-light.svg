<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="The Carbon-OCR pipeline: input, detect, recognize, order, output" font-family="Plex" font-size="14"><title>The Carbon-OCR pipeline: input, detect, recognize, order, output</title><style>@font-face{font-family:"Plex";font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"PlexMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}</style>
