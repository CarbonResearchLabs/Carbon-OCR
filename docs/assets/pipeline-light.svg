<text x="272.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">02  DETECT</text>
<text x="272.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">orientation, 12 bins</text>
<text x="272.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">deskew</text>
