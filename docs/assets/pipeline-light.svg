<text x="272.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">line boxes, pictures</text>
<path d="M476.0 130.0L485.0 138.0L476.0 146.0" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="496.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
