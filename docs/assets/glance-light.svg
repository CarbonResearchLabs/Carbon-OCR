<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Carbon-OCR at a glance" font-family="Plex" font-size="14"><title>Carbon-OCR at a glance</title><style>@font-face{font-family:"Plex";font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"PlexMono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x="0.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#5bbff4"/>
<text x="0.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">2.83 M</text>
<text x="0.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">parameters in fullerene-3M, the Latin set: orient,</text>
<text x="0.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">det, script, rec-latin, order</text>
<rect x="412.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#79ee5f"/>
<text x="412.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">10.8</text>
<text x="412.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">GMAC to read a typical Latin page: one detection</text>
<text x="412.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">pass and 40 lines</text>
<rect x="824.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#74f2d6"/>
<text x="824.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">43.5</text>
<text x="824.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">OmniParseBench headline of fullerene-3M on all</text>
<text x="824.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">2,937 pages; Tesseract 5.5: 5.9</text>
<rect x="0.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#f2b43c"/>
<text x="0.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">62 G</text>
<text x="0.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">MAC/s for rec-latin on one CPU core, measured:</text>
<text x="0.0" y="310.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">ONNX Runtime, FP32, AVX2</text>
<rect x="412.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#d6352a"/>
<text x="412.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">12.8 T</text>
<text x="412.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">MAC/s for rec-latin in FP16 on a laptop RTX 4060,</text>
<text x="412.0" y="310.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">measured: TensorRT 11.4</text>
<rect x="824.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#1a1a1a"/>
<text x="824.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">220</text>
<text x="824.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">tests: 204 in CI on Windows and Linux, and 16 more</text>
<text x="824.0" y="310.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">on a GPU</text>
</svg>
